<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kontakt — Szymon-art</title><style> :root{--bg:#17191c;--gold:#e6b83b;--paper:#f0ebdd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:17px/1.6 Arial,sans-serif}.wrap{max-width:780px;margin:auto;padding:45px 24px}h1{font:900 clamp(42px,8vw,70px) Impact,Arial,sans-serif;color:var(--gold);margin:20px 0}a{color:var(--gold)}.back{display:inline-block;margin-bottom:25px}label{display:block;margin:18px 0 6px;font-weight:bold}input,textarea{width:100%;padding:13px;font:inherit;border:2px solid #c8b77e;background:#fff;color:#17191c;border-radius:3px}textarea{min-height:180px;resize:vertical}button{background:var(--gold);border:0;color:#17191c;padding:15px 26px;font:900 16px Arial;cursor:pointer;margin-top:20px}.note{color:#d4ccba;font-size:14px}.links{display:grid;gap:14px}.links a{display:block;padding:18px;border:1px solid #8b773e;text-decoration:none;font-weight:bold}.links a:hover{background:#292a2d}</style></head><body><main class="wrap"><a class="back" href="index.html">← Strona główna</a><h1>KONTAKT</h1><p>Masz pytanie, propozycję lub chcesz po prostu napisać? Śmiało!</p><form id="contact" action="#" method="POST"><label for="sender">Twój adres e-mail</label><input id="sender" name="email" type="email" autocomplete="email" required><label for="subject">Temat</label><input id="subject" name="_subject" required maxlength="150"><label for="message">Wiadomość</label><textarea id="message" name="message" required></textarea><input type="hidden" name="_captcha" value="true"><input type="hidden" name="_template" value="table"><button type="submit">WYŚLIJ WIADOMOŚĆ ✉</button></form><p class="note">Formularz wymaga jednorazowego podłączenia adresu odbiorcy. Adres wpisany przez nadawcę będzie widoczny w treści otrzymanej wiadomości, ale nie jest automatycznie weryfikowany.</p><script>document.getElementById('contact').addEventListener('submit',function(e){e.preventDefault();alert('Formularz czeka na podłączenie Twojego adresu e-mail. Podaj go właścicielowi strony, aby uruchomić wysyłanie.');});</script></main></body></html>
